[versions]
agp = "9.4.1"
kotlin = "2.4.21"
coreKtx = "1.19.1"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
composeBom = "2026.09.00"
junit = "4.13.2"
androidxJunit = "1.3.0"
espresso = "3.7.0"
ksp = "2.3.12"
room = "2.8.5"
coroutines = "1.11.0"
work = "2.12.0"
coil = "3.6.3"
nav3 = "1.2.0"
